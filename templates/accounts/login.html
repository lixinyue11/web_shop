{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate '登录' %}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center mb-4" style="color: var(--pink-dark);">
                    <i class="bi bi-person-heart"></i> {% translate '欢迎回来' %}
                </h3>
                <form method="post">
                    {% csrf_token %}
                    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                    <div class="mb-3">
                        <label class="form-label">{% translate '用户名' %}</label>
                        <input type="text" name="username" class="form-control" placeholder="{% translate '请输入用户名' %}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{% translate '密码' %}</label>
                        <input type="password" name="password" class="form-control" placeholder="{% translate '请输入密码' %}" required>
                    </div>
                    <button type="submit" class="btn btn-pink w-100 py-2 mb-3">{% translate '登录' %}</button>
                </form>
                <div class="text-center">
                    <p class="mb-2">{% translate '还没有账号？' %}<a href="{% url 'register' %}" style="color: var(--pink-main);">{% translate '立即注册' %}</a></p>
                    <p><small>{% translate '商家入驻？' %}<a href="{% url 'register_merchant' %}" style="color: var(--pink-dark);">{% translate '商家注册' %}</a></small></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
