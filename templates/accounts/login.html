{% extends 'base.html' %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center mb-4" style="color: var(--pink-dark);">
                    <i class="bi bi-person-heart"></i> 欢迎回来
                </h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-pink w-100 py-2 mb-3">登录</button>
                </form>
                <div class="text-center">
                    <p class="mb-2">还没有账号？<a href="{% url 'register' %}" style="color: var(--pink-main);">立即注册</a></p>
                    <p><small>商家入驻？<a href="{% url 'register_merchant' %}" style="color: var(--pink-dark);">商家注册</a></small></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
