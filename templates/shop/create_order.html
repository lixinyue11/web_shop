{% extends 'base.html' %}
{% block title %}下单{% endblock %}

{% block content %}
<div class="container py-4">
    <h4 class="mb-4" style="color: var(--pink-dark);"><i class="bi bi-bag-check me-2"></i>确认订单</h4>

    <div class="row">
        <div class="col-md-8">
            <div class="card p-4 mb-4">
                <h5>收货信息</h5>
                <hr>
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">联系人</label>
                            <input type="text" name="contact_name" class="form-control" placeholder="请输入收货人姓名" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">联系电话</label>
                            <input type="tel" name="contact_phone" class="form-control" placeholder="请输入手机号" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">收货地址</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="请输入详细地址" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">购买数量</label>
                        <input type="number" name="quantity" class="form-control" value="1" min="1" max="{{ product.stock }}" style="width: 120px;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea name="note" class="form-control" rows="2" placeholder="选填"></textarea>
                    </div>
                    <button type="submit" class="btn btn-pink btn-lg w-100">提交订单</button>
                </form>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4">
                <h5>商品信息</h5>
                <hr>
                {% if product.main_image %}
                <img src="{{ product.main_image.image.url }}" class="img-fluid rounded mb-3">
                {% endif %}
                <h6>{{ product.name }}</h6>
                <p class="product-price fs-4">¥{{ product.price }}</p>
                <small class="text-muted">库存：{{ product.stock }} 件</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
