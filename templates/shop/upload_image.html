{% extends 'base.html' %}
{% block title %}上传图片给 {{ merchant.display_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'home' %}" style="color: var(--pink-main);">首页</a></li>
            <li class="breadcrumb-item"><a href="{% url 'shop_detail' merchant.id %}" style="color: var(--pink-main);">{{ merchant.display_name }}</a></li>
            <li class="breadcrumb-item active">上传图片</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h4 class="mb-4" style="color: var(--pink-dark);">
                    <i class="bi bi-images me-2"></i>上传图片给 {{ merchant.display_name }}
                </h4>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">选择图片（可多选）</label>
                        <input type="file" name="images" class="form-control" accept="image/*" multiple required>
                        <small class="text-muted">支持 JPG、PNG 等图片格式，单次最多 {{ MAX_UPLOAD_IMAGES }} 张</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">备注说明（选填）</label>
                        <textarea name="note" class="form-control" rows="3" placeholder="可以添加一些说明..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-pink px-4">
                            <i class="bi bi-upload me-1"></i>上传
                        </button>
                        <a href="{% url 'shop_detail' merchant.id %}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
